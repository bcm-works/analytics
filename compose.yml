name: bcm-analytics

services:
  plausible_db:
    container_name: bcm-analytics-db
    image: postgres:16-alpine
    restart: always
    volumes:
      - bcm-analytics-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  plausible_events_db:
    container_name: bcm-analytics-events-db
    build:
      context: .
      dockerfile: Clickhouse.Dockerfile
    restart: always
    volumes:
      - bcm-analytics-event-data:/var/lib/clickhouse
      - bcm-analytics-event-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
        ]
      start_period: 1m

  plausible:
    container_name: bcm-analytics-app
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    volumes:
      - bcm-analytics-plausible-data:/var/lib/plausible
    ports:
      # Use HTTP_PORT env variable or default to 8000 (host:container — Plausible binds to HTTP_PORT inside the container)
      - "${HTTP_PORT:-8000}:${HTTP_PORT:-8000}"
      # When HTTPS_PORT is set, expose it; otherwise duplicate the HTTP mapping so Docker Compose ignores it
      - "${HTTPS_PORT:-8000}:${HTTPS_PORT_CONT:-${HTTPS_PORT:-8000}}"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=${BASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DISABLE_REGISTRATION=true
      - ENABLE_EMAIL_VERIFICATION=false
      - HTTP_PORT
      - HTTPS_PORT

volumes:
  bcm-analytics-db-data:
  bcm-analytics-event-data:
  bcm-analytics-event-logs:
  bcm-analytics-plausible-data:
